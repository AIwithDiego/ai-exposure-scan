name: demo

# Publishes the dashboard with sample data (data/demo-findings.json) to GitHub Pages.
# Only a merge to main deploys; branches and PRs never do.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build the demo
        working-directory: dashboard
        env:
          VITE_DEMO: "1"
          BASE_PATH: /ai-exposure-scan/
        run: |
          npm ci
          mkdir -p public
          cp ../data/demo-findings.json public/findings.json
          npm run build
          cp ../docs/design-system.html dist/design-system.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
